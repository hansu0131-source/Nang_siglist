<script>
const input = document.getElementById("search");
const tbody = document.getElementById("tbody");
const thNo = document.getElementById("thNo");

const SIGS = JSON.parse(document.getElementById("data").textContent);

let ascending = true;
let current = [...SIGS];

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function sortInPlace(arr) {
  arr.sort((a,b) => ascending ? (a.no - b.no) : (b.no - a.no));
}

function render(rows) {
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="2" class="empty">검색 결과 없음</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map((item) => {
    const no = item.no;
    const name = item.name;

    // NEW는 "NEW":true 기준(사용자가 준 데이터 그대로 지원)
    const isNew = item.NEW === true;

    // Re는 "Re":true 기준 (초록 체크)
    const isRe = item.Re === true;

    return `
      <tr>
        <td>${no}</td>
        <td class="sig-name">
          │ ${escapeHtml(name)}
          ${isNew ? '<span class="new-badge">NEW</span>' : ''}
          ${isRe ? '<span class="re-badge">✓ Re</span>' : ''}
        </td>
      </tr>
    `;
  }).join("");
}

function applySearch() {
  const q = input.value.toLowerCase().trim();
  current = SIGS.filter(({no, name}) =>
    String(no).includes(q) || String(name).toLowerCase().includes(q)
  );
  sortInPlace(current);
  render(current);
}

function toggleSort() {
  ascending = !ascending;
  thNo.textContent = ascending ? "번호 ▲" : "번호 ▼";
  sortInPlace(current);
  render(current);
}

input.addEventListener("keyup", applySearch);
thNo.addEventListener("click", toggleSort);

sortInPlace(current);
render(current);
</script>
